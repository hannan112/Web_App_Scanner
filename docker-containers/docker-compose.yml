services:
  # OWASP ZAP for comprehensive active + passive scanning
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    command: >
      zap.sh -daemon 
      -host 0.0.0.0 
      -port 8080 
      -config api.key=changeme123 
      -config api.addrs.addr.name=.* 
      -config api.addrs.addr.regex=true
      -config api.disablekey=false
      -config ajaxSpider.browserId=firefox-headless
      -config spider.maxDepth=3
      -config spider.maxDuration=10
      -config spider.maxParseSize=2621440
      -config ascan.strength=MEDIUM
      -config ascan.alertThreshold=MEDIUM
    ports:
      - "8080:8080"  # ZAP API
      - "8090:8090"  # ZAP Proxy (optional)
    volumes:
      - zap_data:/home/zap/.ZAP
      - ../logs/zap:/home/zap/logs
      - zap_sessions:/home/zap/sessions
    environment:
      - ZAP_API_KEY=changeme123
      - JAVA_OPTS=-Xmx2g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/JSON/core/view/version/?apikey=changeme123"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  # Discovery tools service for enhanced discovery
  discovery-tools:
    build:
      context: ..
      dockerfile: docker-containers/Dockerfile
    command: ["sleep", "infinity"]  # Keep container running
    volumes:
      - discovery_data:/app/data
      - ../logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

volumes:
  zap_data:
  zap_sessions:
  discovery_data: