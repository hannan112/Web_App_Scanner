services:
  # Django backend application
  web:
    build:
      context: ..
      dockerfile: docker-containers/Dockerfile
    ports:
      - "8001:8000"
    volumes:
      - ../backend:/app
      - ./docker-entrypoint.sh:/app/docker-entrypoint.sh:ro
      - static_volume:/app/static
      - media_volume:/app/media
      - logs_volume:/app/logs
    depends_on:
      - db
      - zap
    environment:
      - DATABASE_URL=postgres://scanner:scanner@db:5432/scanner
      - ZAP_HOST=zap
      - ZAP_PORT=8080
      - ZAP_API_KEY=changeme123
      - PYTHONUNBUFFERED=1
      - DJANGO_SUPERUSER_USERNAME=admin
      - DJANGO_SUPERUSER_PASSWORD=adminpassword
      - DJANGO_SUPERUSER_EMAIL=admin@example.com
      - RUN_MIGRATIONS=1
      - COLLECT_STATIC=1
      - WAIT_FOR_ZAP=1
      # - SETUP_TOOLS=1  # Disabled - command doesn't exist
      # Active Scanning Configuration
      - ENABLE_ACTIVE_SCANNING=true
      - MAX_CONCURRENT_ACTIVE_SCANS=3
      - ACTIVE_SCAN_TIMEOUT_MINUTES=60
      - ZAP_ACTIVE_SCAN_STRENGTH=MEDIUM
      - ZAP_SPIDER_MAX_DEPTH=3
      - ZAP_SPIDER_MAX_DURATION=300
      # Security Settings
      - SECRET_KEY=your-production-secret-key-change-this
      - DEBUG=false
      - ALLOWED_HOSTS=localhost,127.0.0.1,web
    restart: unless-stopped

  # PostgreSQL database
  db:
    image: postgres:13
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=scanner
      - POSTGRES_USER=scanner
      - POSTGRES_DB=scanner
    restart: unless-stopped

  # OWASP ZAP for comprehensive active + passive scanning
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    command: >
      zap.sh -daemon 
      -host 0.0.0.0 
      -port 8080 
      -config api.key=changeme123 
      -config api.addrs.addr.name=.* 
      -config api.addrs.addr.regex=true
      -config api.disablekey=false
      -config ajaxSpider.browserId=firefox-headless
      -config spider.maxDepth=3
      -config spider.maxDuration=10
      -config spider.maxParseSize=2621440
      -config ascan.strength=MEDIUM
      -config ascan.alertThreshold=MEDIUM
    ports:
      - "8080:8080"  # ZAP API
      - "8090:8090"  # ZAP Proxy (optional)
    volumes:
      - zap_data:/home/zap/.ZAP
      - ../logs/zap:/home/zap/logs
      - zap_sessions:/home/zap/sessions
    environment:
      - ZAP_API_KEY=changeme123
      - JAVA_OPTS=-Xmx2g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/JSON/core/view/version/?apikey=changeme123"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  # Discovery tools service for enhanced discovery
  discovery-tools:
    build:
      context: ..
      dockerfile: docker-containers/Dockerfile
    command: ["sleep", "infinity"]  # Keep container running
    volumes:
      - discovery_data:/app/data
      - ../logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  # Optional: Add pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@example.com
      - PGADMIN_DEFAULT_PASSWORD=adminpassword
    ports:
      - "5050:80"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
  media_volume:
  logs_volume:
  zap_data:
  zap_sessions:
  discovery_data: