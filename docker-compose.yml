version: '3.8'

services:
  # Django backend application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - static_volume:/app/static
      - media_volume:/app/media
      - logs_volume:/app/logs
    depends_on:
      - db
      - zap
    environment:
      - DATABASE_URL=postgres://scanner:scanner@db:5432/scanner
      - ZAP_HOST=zap
      - ZAP_PORT=8080
      - ZAP_API_KEY=changeme123
      - PYTHONUNBUFFERED=1
      - DJANGO_SUPERUSER_USERNAME=admin
      - DJANGO_SUPERUSER_PASSWORD=adminpassword
      - DJANGO_SUPERUSER_EMAIL=admin@example.com
      - RUN_MIGRATIONS=1
      - COLLECT_STATIC=1
      - WAIT_FOR_ZAP=1
      - SETUP_TOOLS=1
    restart: unless-stopped

  # PostgreSQL database
  db:
    image: postgres:13
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=scanner
      - POSTGRES_USER=scanner
      - POSTGRES_DB=scanner
    restart: unless-stopped

  # OWASP ZAP for passive scanning
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    command: zap.sh -daemon -host 0.0.0.0 -port 8080 -config api.key=changeme123 -config api.addrs.addr.name=.* -config api.addrs.addr.regex=true
    ports:
      - "8080:8080"
    volumes:
      - zap_data:/home/zap/.ZAP
    restart: unless-stopped

  # Optional: Add pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@example.com
      - PGADMIN_DEFAULT_PASSWORD=adminpassword
    ports:
      - "5050:80"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
  media_volume:
  logs_volume:
  zap_data: