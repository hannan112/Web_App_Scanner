version: '3.8'

services:
  # Django Backend
  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: security_scanner_backend
    restart: always
    volumes:
      - ../backend:/app
      - static_volume:/app/static
      - media_volume:/app/media
      - logs_volume:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DEBUG=False
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:?Set ALLOWED_HOSTS}
      - DATABASE_URL=postgres://${POSTGRES_USER:-scanner}:${POSTGRES_PASSWORD:-scanner_password}@db:5432/${POSTGRES_DB:-scanner_db}
      - ZAP_HOST=zap
      - ZAP_PORT=8080
      - ZAP_API_KEY=${ZAP_API_KEY:?Set ZAP_API_KEY}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:?Set CSRF_TRUSTED_ORIGINS}
    ports:
      - "8000:8000"
    depends_on:
      - db
      - zap
    networks:
      - scanner_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: security_scanner_db
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-scanner_db}
      - POSTGRES_USER=${POSTGRES_USER:-scanner}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-scanner_password}
    networks:
      - scanner_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # OWASP ZAP
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: security_scanner_zap
    restart: always
    command: zap.sh -daemon -host 0.0.0.0 -port 8080 -config api.key=${ZAP_API_KEY:?Set ZAP_API_KEY} -config api.addrs.addr.name=.* -config api.addrs.addr.regex=true -config api.disablekey=false -config scanner.threadPerHost=3 -config spider.thread=3 -config pscan.threads=3
    volumes:
      - zap_data:/home/zap/.ZAP
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - ZAP_API_KEY=${ZAP_API_KEY:?Set ZAP_API_KEY}
      - JAVA_OPTS=-Xmx2g -XX:+UseG1GC -XX:+UseStringDeduplication
    deploy:
      resources:
        limits:
          cpus: '3.00'
          memory: 3g
    networks:
      - scanner_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  static_volume:
  media_volume:
  logs_volume:
  zap_data:


networks:
  scanner_network:
    driver: bridge
